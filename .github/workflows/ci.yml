# Build and offline tests on every PR and push to main.
# Model-backed tests (Julia/Kokoro/Whisper) run in models-nightly.yml; cloud tests run in live-smoke.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  hygiene:
    name: Hygiene (owner values, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Owner-specific resource names and private paths must never be committed. The regex lives in the
      # OWNER_VALUES_PATTERN repository secret so the public workflow does not itself publish those values.
      - name: Check for owner-specific values
        env:
          OWNER_VALUES_PATTERN: ${{ secrets.OWNER_VALUES_PATTERN }}
        run: |
          if [ -z "$OWNER_VALUES_PATTERN" ]; then
            echo "::notice::OWNER_VALUES_PATTERN secret is not set (forks); skipping the owner-values check. gitleaks still runs."
            exit 0
          fi
          if git grep -q -i -I -E "$OWNER_VALUES_PATTERN" -- .; then
            git grep -l -i -I -E "$OWNER_VALUES_PATTERN" -- .
            echo "::error::Owner-specific values found in the files above. Replace them with placeholders such as <account>."
            exit 1
          fi
          echo "No owner-specific values found."

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"

  windows:
    name: Windows (full solution)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_FILTER: Category!=Julia&Category!=Kokoro&Category!=Whisper&Category!=Live&Category!=Copilot&Category!=LocalRuntime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore MediaStudio.slnx --locked-mode

      # Directory.Build.props sets TreatWarningsAsErrors; -warnaserror also covers MSBuild/NuGet warnings.
      - name: Build
        run: dotnet build MediaStudio.slnx -c Release --no-restore -warnaserror

      # Whitespace rules come from .editorconfig. Run on Windows: line endings are CRLF.
      - name: Format check
        run: dotnet format whitespace MediaStudio.slnx --verify-no-changes

      - name: Test (xUnit, offline categories)
        run: dotnet test MediaStudio.slnx -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults

      # Console-runner suites exit non-zero on failure. Visual tests read fixtures/ relative to the repo root.
      - name: Test (console runners)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/VideoProduction.Tests -c Release --no-build
          dotnet run --project tests/VideoProduction.Decisions.Tests -c Release --no-build
          dotnet run --project tests/VideoProduction.Visual.Tests -c Release --no-build

      - name: Build Bicep
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          az bicep build --file infra/main.bicep --stdout | Out-Null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  linux:
    name: Linux (cross-platform projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The CLI pulls in Core, Providers, Decisions, Configuration, Speech, Media.Audio and Media.Narration;
      # the WPF app (MediaStudio.App) is Windows-only and is built by the windows job.
      - name: Restore and build
        run: |
          set -euo pipefail
          for project in \
            src/VideoProduction.Cli/VideoProduction.Cli.csproj \
            src/audio-transcriber/audio-transcriber.csproj \
            src/MediaStudio.Agents/MediaStudio.Agents.csproj \
            src/MediaStudio.Sources/MediaStudio.Sources.csproj \
            src/VideoProduction.AgentFramework/VideoProduction.AgentFramework.csproj \
            src/VideoStudio.Contracts/VideoStudio.Contracts.csproj; do
            echo "::group::$project"
            dotnet restore "$project" --locked-mode
            dotnet build "$project" -c Release --no-restore -warnaserror
            echo "::endgroup::"
          done
