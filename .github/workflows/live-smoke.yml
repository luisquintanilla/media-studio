# Manual smoke test against the azd-provisioned Foundry resource, using GitHub OIDC (no secrets in the repo).
# Imports the azd outputs into app settings, probes every cloud role, then runs the Category=Live tests.
# Skips cleanly when the azd pipeline variables are not configured.
name: Live smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-smoke-${{ vars.AZURE_ENV_NAME }}
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  not-configured:
    name: Azure not configured
    if: vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == '' || vars.AZURE_ENV_NAME == '' || vars.AZURE_LOCATION == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Skipping live smoke. Provision with azure-dev.yml after 'azd pipeline config --provider github' sets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_ENV_NAME and AZURE_LOCATION."

  smoke:
    name: configure azd + configure test + Live tests
    if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_ENV_NAME != '' && vars.AZURE_LOCATION != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The app authenticates with DefaultAzureCredential, which picks up this az CLI login.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0

      # Recreates the azd environment on the runner from the outputs of the last provision.
      - name: Load azd environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          azd auth login --client-id $env:AZURE_CLIENT_ID --federated-credential-provider github --tenant-id $env:AZURE_TENANT_ID
          azd env new $env:AZURE_ENV_NAME --subscription $env:AZURE_SUBSCRIPTION_ID --location $env:AZURE_LOCATION --no-prompt
          azd env refresh --environment $env:AZURE_ENV_NAME --no-prompt

      - name: Restore (locked)
        run: dotnet restore MediaStudio.slnx --locked-mode

      - name: Build
        run: dotnet build MediaStudio.slnx -c Release --no-restore -warnaserror

      - name: configure azd
        run: dotnet run --project src/VideoProduction.Cli -c Release --no-build -- configure azd --env $env:AZURE_ENV_NAME --tenant $env:AZURE_TENANT_ID

      - name: configure test --cloud-only
        run: dotnet run --project src/VideoProduction.Cli -c Release --no-build -- configure test --cloud-only

      - name: Test (Live)
        run: dotnet test tests/MediaStudio.Tests -c Release --no-build --filter "Category=Live" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-live
          path: TestResults/**/*.trx
          if-no-files-found: ignore
